digitalBot:
  name: TESTE
  description: ""
  division: Home
  startUpRef: "/digitalBot/bots/bot[Initial Greeting_10]"
  defaultLanguage: pt-br
  supportedLanguages:
    pt-br:
      defaultLanguageSkill:
        noValue: true
  variables:
    - booleanVariable:
        name: Flow.CTL_acoaVoosFuturos
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - booleanVariable:
        name: Flow.CTL_clienteVIP
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - booleanVariable:
        name: Flow.CTL_compraComPontosTA
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - booleanVariable:
        name: Flow.CTL_compraDePassagem
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.CTL_DTMF_pontoNavegado
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.WS_sourceOrganizationCode_GetBooking
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.WS_tudaAzulDescription
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
  settingsErrorHandling:
    errorHandling:
      exit:
        none: true
    enableAgentEscalation:
      lit: true
    errorEventHandover:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Desculpe, ocorreu um erro. Aguarde um momento enquanto transfiro você para alguém que possa ajudar.\")))"
    agentEscalationConfirmation:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Você deseja falar com um assistente. É isso?\")))"
    agentEscalationHandover:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Aguarde um momento, vou transferi-lo para alguém.\")))"
    recognitionFailureEventHandover:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Desculpe, não estou entendendo. Aguarde um momento enquanto transfiro você para alguém que possa ajudar.\")))"
    recognitionFailureEventHandling:
      exit:
        none: true
    agentEscalationHandling:
      exit:
        none: true
  tasks:
    - task:
        name: ATUALIZAR FILA
        refId: ATUALIZAR FILA_12
        variables:
          - stringVariable:
              name: Task.nomeFila
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - switch:
              name: Switch
              evaluate:
                firstTrue:
                  default:
                    actions:
                      - updateData:
                          name: Update Data
                          statements:
                            - string:
                                variable: Task.nomeFila
                                value:
                                  lit: Azul - Informacoes
                  cases:
                    - case:
                        value:
                          exp: Flow.CTL_clienteVIP
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Clientes Vips
                    - case:
                        value:
                          exp: "Flow.CTL_clienteVIP\nand Flow.CTL_compraDePassagem\nand Flow.CTL_compraComPontosTA\nand Flow.CTL_DTMF_pontoNavegado == \"1\""
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Vendas - Pontos Peps e Vip
                    - case:
                        value:
                          exp: "Flow.CTL_acoaVoosFuturos\nand Flow.CTL_compraDePassagem\nand Flow.CTL_DTMF_pontoNavegado == \"2\"\nand Flow.WS_sourceOrganizationCode_GetBooking == \"Azul Viagens\""
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Viagens - Vendas
                    - case:
                        value:
                          exp: "Flow.CTL_compraDePassagem\nand Flow.CTL_compraComPontosTA\nand Flow.WS_tudaAzulDescription == \"DIAMANTE\""
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Vendas - Pontos Diamante
                    - case:
                        value:
                          exp: "Flow.CTL_compraDePassagem\nand Flow.CTL_compraComPontosTA\nand Flow.WS_tudaAzulDescription != \"DIAMANTE\"\nand Flow.WS_tudaAzulDescription != \"DIAMANTE UNIQUE\"\nand Flow.WS_tudaAzulDescription != \"AZUL ONE\""
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Vendas - Pontos Demais Outros
                    - case:
                        value:
                          exp: Flow.WS_tudaAzulDescription == "DIAMANTE"
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Tudo Azul Diamante
                    - case:
                        value:
                          exp: Flow.WS_tudaAzulDescription == "DIAMANTE UNIQUE"
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Tudo Azul Diamante Unique
                    - case:
                        value:
                          exp: Flow.WS_tudaAzulDescription == "AZUL ONE"
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Tudo Azul One
                    - case:
                        value:
                          exp: Flow.WS_tudaAzulDescription == "SAFIRA"
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Tudo Azul Safira
                    - case:
                        value:
                          exp: Flow.WS_tudaAzulDescription == "Azul Fidelidade"
                        actions:
                          - updateData:
                              name: Update Data
                              statements:
                                - string:
                                    variable: Task.nomeFila
                                    value:
                                      lit: Azul Tudo Azul
          - decision:
              name: "é vip?"
              condition:
                exp: Flow.CTL_clienteVIP
              outputs:
                "yes":
                  actions:
                    - updateData:
                        name: Update Data
                        statements:
                          - string:
                              variable: Task.nomeFila
                              value:
                                lit: Azul Clientes Vips
                "no":
                  actions:
                    - decision:
                        name: "é compra?"
                        condition:
                          exp: Flow.CTL_compraDePassagem
                        outputs:
                          "yes":
                            actions:
                              - decision:
                                  name: compras com Pontos?
                                  condition:
                                    exp: Flow.CTL_compraComPontosTA
                                  outputs:
                                    "yes":
                                      actions:
                                        - decision:
                                            name: ponto navegados?
                                            condition:
                                              exp: Flow.CTL_DTMF_pontoNavegado == "1"
                                            outputs:
                                              "yes":
                                                actions:
                                                  - updateData:
                                                      name: Update Data
                                                      statements:
                                                        - string:
                                                            variable: Task.nomeFila
                                                            value:
                                                              lit: Azul Vendas - Pontos Peps e Vip
          - endTask:
              name: End Task
              outputPath:
                name: default
  settingsBotFlow:
    virtualAgentEnabled: true
  settingsUserInput:
    noMatchesMax:
      lit: 3
    noInputsMax:
      lit: 3
    noInputsTimeout:
      lit:
        minutes: 1
    endOfSessionMessage:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Você não respondeu, e por isso estou encerrando este chat. Por favor, volte se precisar de minha ajuda. Obrigado.\")))"
    confirmationRejectionsMax:
      lit: 3
    collectionLowConfidenceThreshold:
      lit: 20
    collectionHighConfidenceThreshold:
      lit: 70
    confirmationLowConfidenceThreshold:
      lit: 40
    noMatchApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Desculpe.\")))"
    noInputApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Desculpe, não recebi nenhuma resposta.\")))"
    noToConfirmationApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Enganei-me.\")))"
    confirmationNoMatchApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Por favor, digite \\\"Sim\\\" ou \\\"Não\\\".\")))"
    confirmationNoInputApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Não recebi nenhuma resposta. Por favor, digite \\\"Sim\\\" ou \\\"Não\\\".\")))"
  settingsKnowledge:
    none: true
  settingsVirtualAgent:
    summarization:
      lit: false
    assignWrapupCodes:
      lit: false
  bots:
    - bot:
        name: Initial Greeting
        refId: Initial Greeting_10
        actions:
          - waitForInput:
              name: Wait for Input
              question:
                exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"O que gostaria de fazer?\")))"
              knowledgeSearchResult:
                noValue: true
              noMatch:
                exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Diga-me novamente o que gostaria de fazer.\")))"
  settingsNaturalLanguageUnderstanding:
    nluDomainVersion:
      intents: []
      entities: []
      entityTypes: []
      language: pt-br
      languageVersions: {}
    mutedUtterances: []

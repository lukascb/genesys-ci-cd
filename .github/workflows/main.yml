name: "Action 01 - Processamento de Entrada"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'entrada/**'

jobs:
  generate-output:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Directories
        run: mkdir -p entrada output template_atualizado template_final

      - name: Process Pairs and Run Script
        run: |
          # Ativa ignore case para o shell
          shopt -s nocaseglob
          
          # Itera sobre arquivos YAML que não sejam templates para encontrar os pares
          for file in entrada/*.yaml; do
            if [[ ! "$file" =~ _TEMPLATE\.yaml$ ]]; then
              FILENAME=$(basename "$file" .yaml)
              TEMPLATE_PAIR="entrada/${FILENAME}_TEMPLATE.yaml"
              
              if [ -f "$TEMPLATE_PAIR" ]; then
                echo "Processando par: $file e $TEMPLATE_PAIR"
                GERADO_FILE="output/${FILENAME}_TEMPLATE_GERADO.yaml"
                
                # Execução do script python
                python compare.py -f1 "$TEMPLATE_PAIR" -f2 "$file" -o "$GERADO_FILE"
                
                # Move vars.txt gerado para output
                if [ -f "vars.txt" ]; then
                  mv vars.txt output/
                fi
              fi
            fi
          done

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          if ! git diff --staged --quiet; then
            git commit -m "action 01: templates gerados em output [skip ci]"
            git push
          fi

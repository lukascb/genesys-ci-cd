name: Genesys CI Configuration Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para realizar o push de volta ao repositório

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante o histórico para evitar conflitos no push

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Comparison and Generate Template
        run: |
          python compare.py -f1 TEMPLATE.yaml -f2 CODIGO.yaml
          # O script deve gerar o arquivo template_gerado.yaml

      - name: Commit and Push generated template
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Verifica se o arquivo foi realmente gerado e se houve alteração
          if [ -f "template_gerado.yaml" ]; then
            git add template_gerado.yaml
            if git diff --staged --quiet; then
              echo "Nenhuma alteração detectada no template_gerado.yaml."
            else
              git commit -m "chore: update template_gerado.yaml [skip ci]"
              git push
            fi
          else
            echo "Erro: template_gerado.yaml não foi encontrado."
            exit 1
          fi

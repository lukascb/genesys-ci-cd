name: Genesys CI Configuration Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para realizar o push de volta ao repositório

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create Output Directory
        run: mkdir -p output

      - name: Run Comparison and Generate Files
        run: |
          # Executa o script. Certifique-se de que o compare.py salve os arquivos 
          # ou que você os mova para a pasta output após a execução.
          python compare.py -f1 TEMPLATE.yaml -f2 CODIGO.yaml
          
          # Move os arquivos gerados para o diretório de destino
          # (Ajuste se o script já salvar diretamente em output/)
          mv template_gerado.yaml vars.txt output/ 2>/dev/null || true

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adiciona o diretório inteiro
          git add output/
          
          # Verifica se houve mudanças reais para evitar commits vazios
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada nos arquivos de saída."
          else
            git commit -m "chore: update comparison outputs (template & vars) [skip ci]"
            git push
          fi

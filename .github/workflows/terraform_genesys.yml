name: "Terraform Genesys Deployment"

on:
  push:
    branches: [ "main" ]
    # Monitora exclusivamente a pasta terraform na raiz do projeto
    paths:
      - 'terraform/**'

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GENESYSCLOUD_OAUTHCLIENT_ID: ${{ secrets.GENESYS_CLIENT_ID }}
      GENESYSCLOUD_OAUTHCLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
      GENESYSCLOUD_REGION: "sa-east-1"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform

      - name: Sync Flow Files
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Garante que os arquivos YAML baixados pelo Terraform sejam commitados
          mkdir -p terraform/genesyscloud/flows
          git add terraform/genesyscloud/flows/*.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync genesys flows downloaded via terraform [skip ci]"
            git push
          else
            echo "Nenhuma alteração nos arquivos YAML detectada."
          fi

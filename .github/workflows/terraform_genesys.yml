name: "Terraform Genesys Deployment"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/Fluxo teste.tf'


jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    env:
      TF_LOG: DEBUG
      GENESYSCLOUD_OAUTHCLIENT_ID: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_ID }}
      GENESYSCLOUD_OAUTHCLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
      GENESYSCLOUD_REGION: "sa-east-1"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      GENESYSCLOUD_TOKEN_INIT_TIMEOUT: "120s"
      GENESYSCLOUD_TOKEN_ACQUIRE_TIMEOUT: "60s"
      GENESYSCLOUD_CUSTOM_RETRY_TIMEOUT: "10m"
    permissions:
      contents: write

    # Adicionamos uma verificação para garantir que houve adições ou modificações
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Necessário para comparar o commit atual com o anterior
     
      
      - name: Validate secrets are set
        run: |
          [ -z "$GENESYSCLOUD_OAUTHCLIENT_ID" ]     && echo " CLIENT_ID missing"     || echo " CLIENT_ID set"
          [ -z "$GENESYSCLOUD_OAUTHCLIENT_SECRET" ] && echo " CLIENT_SECRET missing" || echo " CLIENT_SECRET set"
          [ -z "$TF_TOKEN_app_terraform_io" ] && echo " TF_TOKEN missing" || echo " TF_TOKEN set"
          [ -z "$GENESYSCLOUD_REGION " ] && echo " Region missing" || echo " TF_TOKEN set"
          [ -z "$GENESYSCLOUD_TOKEN_INIT_TIMEOUT " ] && echo " Token Init Timeout NOT SET" || echo "Token Init Timeout "
          [ -z "$GENESYSCLOUD_TOKEN_ACQUIRE_TIMEOUT " ] && echo "Token Init Acquire NOT SET" || echo "  Token Acquire Timeout"
          [ -z "$GENESYSCLOUD_CUSTOM_RETRY_TIMEOUT " ] && echo "  Token Retry Acquire NOT SET" || echo "Token Retry Timeout"
          
          
      - name: Criar diretório
        id: criar_genesyscloud
        run: |
          mkdir -p terraform/genesyscloud/flows
          
      - name: Check for Deleted Files Only
        id: check_changes
        run: |
          # Lista arquivos alterados, ignorando os deletados
          # 'A' = Adicionado, 'M' = Modificado, 'R' = Renomeado
          CHANGES=$(git diff --name-only --diff-filter=AMR HEAD^ HEAD | grep "terraform/Fluxo teste.tf" || true)
          
          if [ -z "$CHANGES" ]; then
            echo "Apenas exclusões detectadas ou nenhuma mudança relevante em ./terraform. Cancelando execução."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Mudanças detectadas (adição/modificação). Prosseguindo..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        if: steps.check_changes.outputs.skip == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Terraform Init
        if: steps.check_changes.outputs.skip == 'false'
        run: terraform init
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
                
      - name: Terraform Plan
        if: steps.check_changes.outputs.skip == 'false'
        run: terraform plan -input=false
        working-directory: ./terraform
        env:
          GENESYSCLOUD_OAUTHCLIENT_ID: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_ID }}
          GENESYSCLOUD_OAUTHCLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
          GENESYSCLOUD_REGION: "sa-east-1"
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      
      
      - name: Terraform Apply
        if: steps.check_changes.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform
        env:
          GENESYSCLOUD_OAUTHCLIENT_ID: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_ID }}
          GENESYSCLOUD_OAUTHCLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
          GENESYSCLOUD_REGION: "sa-east-1"
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Debug Files
        run: ls -R terraform/genesyscloud/flows/
      
      - name: Git Config and Add
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add . # Adiciona tudo que foi alterado para evitar erro de pathspec
          git commit -m "Update Genesys Cloud flows" || echo "No changes to commit"

        

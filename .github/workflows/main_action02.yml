name: "Action 02 - Consolidação Final"

on:
  push:
    branches:
      - main
    paths:
      - 'template_atualizado/**'

jobs:
  consolidation:
    name: consolidate-templates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure directories exist
        run: |
          mkdir -p template_atualizado template_final

      - name: Dynamic Processing and Consolidation
        shell: bash
        run: |
          # Habilita o rastreio de erros e iteração limpa
          shopt -s nullglob
          
          echo "Iniciando busca por arquivos *_TEMPLATE_GERADO.yaml em template_atualizado/..."
          
          for gerado_path in template_atualizado/*_TEMPLATE_GERADO.yaml; do
            # Extração do nome base (Ex: template_atualizado/servico_TEMPLATE_GERADO.yaml -> servico)
            filename=$(basename "$gerado_path")
            prefix="${filename%_TEMPLATE_GERADO.yaml}"
            
            # Define o caminho do arquivo FINAL correspondente
            final_path="template_atualizado/${prefix}_TEMPLATE_FINAL.yaml"
            output_path="template_final/${prefix}_TEMPLATE_FINAL.yaml"
            
            if [[ -f "$final_path" ]]; then
              echo "---------------------------------------------------"
              echo "Processando Par Encontrado:"
              echo "  - Gerado: $gerado_path"
              echo "  - Final:  $final_path"
              
              python compare.py -f1 "$final_path" -f2 "$gerado_path" -o "$output_path"
              
              if [[ -f "vars.txt" ]]; then
                echo "[LOG] vars.txt gerado para $prefix. Movendo para template_final/."
                mv vars.txt "template_final/vars_${prefix}.txt"
              fi
            else
              echo "[AVISO] Arquivo final não encontrado para o prefixo: $prefix (Esperado: $final_path)"
            fi
          done

      - name: Publish Results to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Adiciona apenas a pasta de destino final
          git add template_final/
          
          # Verifica alterações staged antes de commitar
          if ! git diff --staged --quiet; then
            echo "Alterações detectadas. Realizando commit..."
            git commit -m "chore: atualização automática de template_final e vars.txt [skip ci]"
            git push
          else
            echo "Nenhuma mudança relevante encontrada em template_final/. Encerrando."
          fi

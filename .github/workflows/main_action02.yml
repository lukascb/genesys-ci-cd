name: "Action 02 - Consolidação Final"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'template_atualizado/**'

jobs:
  finalize-template:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Directories
        run: mkdir -p template_atualizado template_final

      - name: Run Comparison and Finalize
        run: |
          # Define caminhos dos arquivos baseados na sua regra
          FILE_GERADO="template_atualizado/ARQUIVO_TEMPLATE_GERADO.yaml"
          FILE_FINAL_INPUT="template_atualizado/ARQUIVO_TEMPLATE_FINAL.yaml"
          VARS_INPUT="template_atualizado/vars.txt"
          
          if [ -f "$FILE_GERADO" ] && [ -f "$FILE_FINAL_INPUT" ]; then
            echo "Arquivos detectados. Iniciando consolidação final..."
            
            # Executa o script python conforme solicitado
            python compare.py -f1 "$FILE_FINAL_INPUT" -f2 "$FILE_GERADO" -o "./template_final/ARQUIVO_TEMPLATE_FINAL.yaml"
            
            # Move o vars.txt (seja o gerado agora ou o que foi inserido na pasta)
            if [ -f "vars.txt" ]; then
              mv vars.txt template_final/
            elif [ -f "$VARS_INPUT" ]; then
              cp "$VARS_INPUT" template_final/
            fi
          else
            echo "Aguardando todos os arquivos necessários em template_atualizado..."
            exit 0
          fi

      - name: Commit and Push Final Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add template_final/
          if ! git diff --staged --quiet; then
            git commit -m "action 02: template final e vars atualizados [skip ci]"
            git push
          fi
